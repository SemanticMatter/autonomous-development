[project]
name = "claude-codex-autonomous-development"
version = "0.3.0"
description = "Claude Code plugin for bounded autonomous feature development with Codex planning and review"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Development checks run through pre-commit (see .pre-commit-config.yaml).
dev = [
    "pre-commit~=4.6",
]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
